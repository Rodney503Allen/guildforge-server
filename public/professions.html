<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guildforge | Professions</title>
  <link rel="stylesheet" href="/statpanel.css" />
</head>
<body>
  <div id="statpanel-root"></div>
  <script src="/statpanel.js" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const openProfessions = () => {
        if (window.GFReferenceModal?.open) {
          window.GFReferenceModal.open("professions");
          return;
        }
        window.setTimeout(openProfessions, 25);
      };
      openProfessions();
    });
  </script>
</body>
</html>
